<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Your Taxi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-bar">
  <a href="/" class="back-btn" title="Back to mode selection">&#8592;</a>
  🚕 Rate Your Taxi
</header>
<main>

  <section id="lookupSection" class="card">
    <h2>Find your taxi</h2>
    <input id="plateInput" placeholder="Enter number plate e.g. ND 456-123" autocomplete="off">
    <button id="lookupBtn" onclick="lookupByPlate()">Find taxi</button>
    <div id="lookupError" class="alert hidden"></div>
  </section>

  <section id="taxiSection" class="card hidden">
    <h2 id="taxiPlate"></h2>
    <p>Driver: <strong id="driverName"></strong></p>
    <p class="muted" id="ratingSummary"></p>

    <h2>Rate this trip</h2>

    <!-- Star picker — five large tappable buttons -->
    <div class="star-picker" id="starPicker" role="group" aria-label="Star rating, 1 to 5">
      <button class="star-btn" data-v="1" type="button" aria-pressed="false" aria-label="1 star"   onclick="selectStar(1)">☆</button>
      <button class="star-btn" data-v="2" type="button" aria-pressed="false" aria-label="2 stars"  onclick="selectStar(2)">☆</button>
      <button class="star-btn" data-v="3" type="button" aria-pressed="false" aria-label="3 stars"  onclick="selectStar(3)">☆</button>
      <button class="star-btn" data-v="4" type="button" aria-pressed="false" aria-label="4 stars"  onclick="selectStar(4)">☆</button>
      <button class="star-btn" data-v="5" type="button" aria-pressed="false" aria-label="5 stars"  onclick="selectStar(5)">☆</button>
    </div>
    <p class="rating-label">Your rating: <strong id="ratingValue">0</strong>/5</p>
    <p id="ratingRequired" class="rating-required hidden">Please select a star rating before submitting.</p>

    <textarea id="comment" rows="3" placeholder="Leave a comment (optional)"></textarea>

    <div id="reportOptions">
      <div class="checkbox-row"><input type="checkbox" id="r1" value="unsafe driving"><label for="r1">Unsafe driving</label></div>
      <div class="checkbox-row"><input type="checkbox" id="r2" value="overloading"><label for="r2">Overloading</label></div>
      <div class="checkbox-row"><input type="checkbox" id="r3" value="rude behaviour"><label for="r3">Rude behaviour</label></div>
      <div class="checkbox-row"><input type="checkbox" id="r4" value="reckless speeding"><label for="r4">Reckless speeding</label></div>
      <div class="checkbox-row"><input type="checkbox" id="r5" value="compliment"><label for="r5">Compliment excellent service</label></div>
    </div>

    <button id="submitBtn" onclick="submitFeedback()">Submit feedback</button>

    <div id="submitted" class="hidden">
      <div class="rating-confirm">
        <p class="rating-confirm-msg">✅ Thank you! Your feedback has been submitted.</p>
        <div id="confirmedRating" class="rating-confirm-stars"></div>
        <p class="muted" style="margin-top:6px;font-size:13px;">The taxi owner has been notified.</p>
      </div>
      <button class="secondary" onclick="resetForm()">Rate another taxi</button>
    </div>
  </section>

</main>
<footer class="tip">Feedback goes straight to the taxi owner. Be honest — it helps keep drivers accountable.</footer>

<script src="/passenger/app.js"></script>
</body>
</html>
