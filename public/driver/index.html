<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver App — Taxi Fleet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-bar">
  <a href="/" id="backBtn" class="back-btn" title="Back to mode selection">&#8592;</a>
  🚖 Driver <small id="driverName"></small>
</header>
<main>

  <section id="authSection" class="card">
    <h2>Driver Login</h2>
    <input id="loginPhone" placeholder="Your phone number" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Login</button>
    <div id="authError" class="alert hidden"></div>
    <p class="muted">Your owner must register and approve you before you can log in.</p>
  </section>

  <div id="app" class="hidden">

    <!-- Work Shift -->
    <section class="card" id="shiftCard">
      <h2>Work Shift</h2>

      <div class="shift-status-row">
        <div>
          <div class="shift-label">Duty status</div>
          <span id="shiftStatus" class="badge offline">OFF DUTY</span>
        </div>
        <div>
          <div class="shift-label">Location sharing</div>
          <span id="gpsStatus" class="badge offline">INACTIVE</span>
        </div>
      </div>

      <div id="taxiInfo" class="shift-taxi-info hidden"></div>

      <div id="locDetail" class="loc-detail hidden">
        <span id="locCoords"></span>
        <span id="locAccuracy" class="muted"></span>
      </div>

      <div id="locStatusMsg" class="loc-status-msg muted"></div>

      <div style="display:flex;gap:10px;margin-top:12px;">
        <button id="startBtn" onclick="startShift()" style="flex:1;">▶ START SHIFT</button>
        <button id="endBtn" class="danger hidden" onclick="endShift()" style="flex:1;">■ END SHIFT</button>
      </div>
    </section>

    <!-- Earnings -->
    <section class="card">
      <h2>Earnings</h2>
      <div class="row">
        <div class="stat"><div class="num" id="earnToday">R0</div><div class="label">Today</div></div>
        <div class="stat"><div class="num" id="earnWeek">R0</div><div class="label">Week</div></div>
        <div class="stat"><div class="num" id="earnMonth">R0</div><div class="label">Month</div></div>
      </div>
    </section>

    <!-- Record a trip -->
    <section class="card">
      <h2>Record a trip / fare</h2>
      <input id="fareInput" type="number" min="0" step="0.5" placeholder="Fare collected (R)">
      <button onclick="logTrip()">Log trip</button>
    </section>

    <!-- Messages -->
    <section class="card">
      <h2>Messages from owner</h2>
      <div id="messages"></div>
    </section>

    <!-- SOS -->
    <section class="card">
      <button class="danger" onclick="sendSos()">🚨 SOS — send location to owner</button>
    </section>

    <button class="secondary" onclick="logout()">Log out</button>
  </div>

</main>
<footer class="tip">Location is only shared while a shift is active.</footer>

<script src="/socket.io/socket.io.js"></script>
<script src="/driver/app.js"></script>
</body>
</html>
